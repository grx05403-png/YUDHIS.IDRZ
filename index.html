<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rindu</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #1a1020, #0e0a12, #1f1220, #0a070d);
        background-size: 400% 400%;
        animation: bgShift 18s ease infinite;
        color: #e3d5e3;
        font-family: "Segoe UI", Tahoma, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
        overflow: hidden;
        position: relative;
    }

    @keyframes bgShift {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* ===== Background hati ===== */
    .hearts-bg {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
    }

    .heart {
        position: absolute;
        bottom: -40px;
        color: #ff5f8f;
        opacity: 0;
        animation: floatUp linear infinite;
        text-shadow: 0 0 10px rgba(255, 95, 143, 0.6);
        will-change: transform, opacity;
    }

    @keyframes floatUp {
        0%   { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 0; }
        15%  { opacity: 0.85; }
        85%  { opacity: 0.5; }
        100% { transform: translateY(-110vh) scale(1.1) rotate(25deg); opacity: 0; }
    }

    /* ===== Kartu kaca ===== */
    .card {
        max-width: 540px;
        width: 100%;
        padding: 40px 32px 32px;
        text-align: center;
        position: relative;
        z-index: 2;

        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 180, 210, 0.15);
        border-radius: 22px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        box-shadow:
            0 0 40px rgba(255, 95, 143, 0.15),
            inset 0 0 20px rgba(255, 180, 210, 0.05);
    }

    /* ===== Ikon hati kecil di atas ===== */
    .card-heart {
        font-size: 1.6rem;
        color: #ff8fb3;
        margin-bottom: 16px;
        display: inline-block;
        animation: pulse 2.4s ease-in-out infinite;
        filter: drop-shadow(0 0 12px rgba(255, 143, 179, 0.7));
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.18); }
    }

    /* ===== Teks utama ===== */
    #text {
        font-size: 1.15rem;
        line-height: 1.9;
        min-height: 90px;
        white-space: pre-wrap;
        color: #f0e0f0;
        text-shadow: 0 0 12px rgba(255, 95, 143, 0.25);
        transition: opacity 0.4s ease;
    }

    #text .caret {
        display: inline-block;
        width: 2px;
        height: 1.1em;
        background-color: #ff8fb3;
        margin-left: 2px;
        vertical-align: middle;
        animation: blink 0.8s steps(1) infinite;
        box-shadow: 0 0 6px #ff8fb3;
    }

    @keyframes blink {
        50% { opacity: 0; }
    }

    /* ===== Penutup dari Yudhis ===== */
    #closing {
        margin-top: 26px;
        padding-top: 22px;
        border-top: 1px solid rgba(255, 180, 210, 0.15);

        font-size: 1.05rem;
        font-style: italic;
        line-height: 1.7;
        color: #ffb3c9;

        opacity: 0;
        transform: translateY(10px);
        transition: opacity 1.2s ease, transform 1.2s ease;

        text-shadow: 0 0 14px rgba(255, 143, 179, 0.45);
        letter-spacing: 0.4px;
    }

    #closing.show {
        opacity: 1;
        transform: translateY(0);
    }

    #closing .signature {
        display: block;
        margin-top: 6px;
        font-size: 0.95rem;
        color: #ff8fb3;
        font-weight: 600;
        letter-spacing: 1px;
    }

    /* ===== Progress bar ===== */
    .progress {
        width: 60%;
        height: 2px;
        margin: 24px auto 0;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 2px;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(to right, #ff5f8f, #ff8fb3);
        border-radius: 2px;
        transition: width 0.35s ease;
        box-shadow: 0 0 8px rgba(255, 95, 143, 0.7);
    }

    /* ===== Hint ===== */
    #hint {
        margin-top: 22px;
        font-size: 0.78rem;
        color: #7a6a7a;
        opacity: 0;
        transition: opacity 1s ease;
    }

    #hint.show {
        opacity: 1;
    }

    /* ===== Tombol musik ===== */
    .music-btn {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 5;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 180, 210, 0.25);
        color: #ffb3c9;
        font-size: 1rem;
        padding: 8px 12px;
        border-radius: 50px;
        cursor: pointer;
        backdrop-filter: blur(6px);
        transition: all 0.3s ease;
    }

    .music-btn:hover {
        background: rgba(255, 95, 143, 0.2);
        box-shadow: 0 0 14px rgba(255, 95, 143, 0.5);
    }

    /* ===== Sparkle cursor ===== */
    .sparkle {
        position: fixed;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: radial-gradient(circle, #ffd1e0, #ff5f8f);
        pointer-events: none;
        z-index: 3;
        animation: sparkleFade 0.8s ease-out forwards;
        box-shadow: 0 0 8px #ff8fb3;
    }

    @keyframes sparkleFade {
        0%   { transform: scale(1); opacity: 1; }
        100% { transform: scale(0.2) translateY(-10px); opacity: 0; }
    }

    @media (max-width: 480px) {
        .card { padding: 32px 20px 24px; }
        #text { font-size: 1rem; }
        #closing { font-size: 0.95rem; }
        .music-btn { padding: 6px 10px; font-size: 0.9rem; }
    }
</style>
</head>
<body>

<!-- Background hati -->
<div class="hearts-bg" id="heartsBg"></div>

<!-- Tombol musik -->
<button class="music-btn" id="musicBtn" title="Musik latar">🎵</button>

<!-- Kartu utama -->
<div class="card">
    <div class="card-heart">❤</div>
    <div id="text"></div>

    <div id="closing">
        Dari Yudhis Jangan Lupa Senyum Sayangkuu.
        <span class="signature">— Yudhis ❤</span>
    </div>

    <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="hint">Tekan Enter atau klik untuk mengulang</div>
</div>

<script>
const textEl     = document.getElementById("text");
const hintEl     = document.getElementById("hint");
const heartsBg   = document.getElementById("heartsBg");
const progressEl = document.getElementById("progressFill");
const musicBtn   = document.getElementById("musicBtn");
const closingEl  = document.getElementById("closing");

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

/* ================= Background hati ================= */
function createHearts(count = 28) {
    const symbols = ["❤", "♡", "♥"];
    for (let i = 0; i < count; i++) {
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        h.style.left = Math.random() * 100 + "vw";
        h.style.fontSize = (10 + Math.random() * 18) + "px";
        h.style.animationDuration = (9 + Math.random() * 8) + "s";
        h.style.animationDelay = (Math.random() * 10) + "s";
        h.style.opacity = 0.3 + Math.random() * 0.5;
        heartsBg.appendChild(h);
    }
}

/* ================= Typewriter ================= */
async function typewriter(el, text, delay = 60) {
    el.innerHTML = "";
    for (let i = 0; i < text.length; i++) {
        el.innerHTML = text.slice(0, i + 1) + '<span class="caret"></span>';
        await sleep(delay);
    }
    el.innerHTML = text;
}

/* ================= Kalimat ================= */
const lines = [
    "Aku sedang memikirkanmu.",
    "Tidak ada alasan khusus.",
    "Hanya rindu.",
    "Semoga harimu baik.",
    "Aku menunggu kabarmu."
];

let isPlaying = false;

async function playScene() {
    if (isPlaying) return;
    isPlaying = true;

    textEl.innerHTML = "";
    hintEl.classList.remove("show");
    closingEl.classList.remove("show");
    progressEl.style.width = "0%";

    for (let i = 0; i < lines.length; i++) {
        // fade out sebelum ganti kalimat
        textEl.style.opacity = "0";
        await sleep(200);
        textEl.style.opacity = "1";

        await typewriter(textEl, lines[i], 60);

        // progress bar
        progressEl.style.width = ((i + 1) / lines.length * 100) + "%";

        await sleep(1500);
    }

    // Tampilkan penutup dari Yudhis
    await sleep(400);
    closingEl.classList.add("show");

    await sleep(1200);
    hintEl.classList.add("show");
    isPlaying = false;
}

/* ================= Sparkle cursor ================= */
let lastSparkle = 0;
document.addEventListener("mousemove", (e) => {
    const now = Date.now();
    if (now - lastSparkle < 60) return;
    lastSparkle = now;

    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = (e.clientX - 3) + "px";
    s.style.top  = (e.clientY - 3) + "px";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 800);
});

/* ================= Musik ambient (Web Audio) ================= */
let audioCtx = null;
let musicOn = false;
let musicTimer = null;

function startMusic() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];

    function playNote() {
        if (!musicOn) return;

        const osc  = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.value = notes[Math.floor(Math.random() * notes.length)];

        const now = audioCtx.currentTime;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.06, now + 0.6);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 3);

        musicTimer = setTimeout(playNote, 1400 + Math.random() * 900);
    }

    playNote();
}

function stopMusic() {
    musicOn = false;
    clearTimeout(musicTimer);
}

musicBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    musicOn = !musicOn;
    if (musicOn) {
        musicBtn.textContent = "🔇";
        startMusic();
    } else {
        musicBtn.textContent = "🎵";
        stopMusic();
    }
});

/* ================= Kontrol ================= */
document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") playScene();
});
document.addEventListener("click", (e) => {
    if (e.target.closest(".music-btn")) return;
    playScene();
});

/* ================= Jalankan ================= */
createHearts(28);
window.addEventListener("load", playScene);
</script>

</body>
</html>
